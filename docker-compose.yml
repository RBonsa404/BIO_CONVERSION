# Lance toute la plateforme (base PostgreSQL + application) sur n'importe quelle machine :
#   docker compose up --build
# puis ouvrir http://localhost:8080
services:
  postgres:
    image: postgres:15-alpine
    container_name: bioconversion-db
    environment:
      POSTGRES_DB: bioconversion_db
      POSTGRES_USER: bioconversion_user
      POSTGRES_PASSWORD: bioconversion_pass
    ports:
      # Modifiable si le port 5432 est déjà pris : POSTGRES_PORT=5433 docker compose up
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioconversion_user -d bioconversion_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioconversion-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bioconversion_db
      SPRING_DATASOURCE_USERNAME: bioconversion_user
      SPRING_DATASOURCE_PASSWORD: bioconversion_pass
      # Comptes de démonstration (voir README) ; mettre false pour une base vierge
      DEMO_DATA: ${DEMO_DATA:-true}
      ADMIN_TELEPHONE: ${ADMIN_TELEPHONE:-}
      ADMIN_MOT_DE_PASSE: ${ADMIN_MOT_DE_PASSE:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
