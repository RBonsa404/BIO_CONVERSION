version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bioconversion-db
    environment:
      POSTGRES_DB: bioconversion_db
      POSTGRES_USER: bioconversion_user
      POSTGRES_PASSWORD: bioconversion_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
