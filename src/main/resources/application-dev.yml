spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bioconversion_db
    username: bioconversion_user
    password: bioconversion_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

logging:
  level:
    com.bioconversion: DEBUG

app:
  demo:
    enabled: ${DEMO_DATA:true}
