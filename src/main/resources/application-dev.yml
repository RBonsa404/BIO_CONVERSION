spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bioconversion_db
    username: bioconversion_user
    password: bioconversion_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

logging:
  level:
    com.bioconversion: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG


app:
  security:
    allowed-origins: http://localhost:4200
  commission:
    taux: 0.05  # 5% — valeur à confirmer avec la MOA (CDC §2.2.3, C-MUST-5)
  entreprise:
    nom: "BIO CONVERSION"
    ifu: "À renseigner"
    rccm: "À renseigner"
    adresse: "Ouagadougou, Burkina Faso"
    telephone: "À renseigner"
    email: "contact@bioconversion.bf"
    banque: "À renseigner"
    iban: "À renseigner"