spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bioconversion_db
    username: bioconversion_user
    password: bioconversion_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

logging:
  level:
    com.bioconversion: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
