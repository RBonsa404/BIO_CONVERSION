spring:
  datasource:
    url: jdbc:h2:mem:bioconversion_dev
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.bioconversion: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG


app:
  commission:
    taux: 0.05  # 5% — valeur à confirmer avec la MOA (CDC §2.2.3, C-MUST-5)
  entreprise:
    nom: "BIO CONVERSION"
    ifu: "À renseigner"
    rccm: "À renseigner"
    adresse: "Ouagadougou, Burkina Faso"
    telephone: "À renseigner"
    email: "contact@bioconversion.bf"
    banque: "À renseigner"
    iban: "À renseigner"