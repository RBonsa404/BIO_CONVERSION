# Profil de production (Railway, Docker). La connexion PostgreSQL est lue, par ordre de
# priorité, depuis SPRING_DATASOURCE_*, DATABASE_URL (voir DatabaseUrlEnvironmentPostProcessor)
# ou les variables PG* / DB_*.
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:bioconversion_db}}
    username: ${PGUSER:${DB_USER:bioconversion_user}}
    password: ${PGPASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    show-sql: false

logging:
  level:
    com.bioconversion: INFO
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    # Sans JWT_SECRET, un secret aléatoire est tiré à chaque démarrage : l'application
    # reste sûre, mais les sessions ouvertes sont invalidées à chaque redéploiement.
    secret: ${JWT_SECRET:${random.value}${random.value}}
  security:
    # Le frontend est servi par le backend (même origine) : aucune origine externe requise.
    allowed-origins: ${ALLOWED_ORIGINS:}
  paiement:
    webhook-secret: ${WEBHOOK_SECRET:${random.value}${random.value}}
  iot:
    api-key: ${IOT_API_KEY:${random.value}${random.value}}
  factures:
    dossier: ${FACTURES_DIR:/tmp/bioconversion/factures}
  upload:
    identite-dir: ${UPLOAD_DIR:/tmp/bioconversion/identites}
