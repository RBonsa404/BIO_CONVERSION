spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bioconversion_db}
    username: ${DB_USER:bioconversion}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

logging:
  level:
    com.bioconversion: INFO
    org.springframework.security: WARN
