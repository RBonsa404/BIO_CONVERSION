server:
  # Les hébergeurs (Railway, Render...) imposent le port via la variable PORT.
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml

spring:
  application:
    name: bioconversion-backend

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  web:
    resources:
      # Le frontend Angular compilé est servi par le backend : embarqué dans le jar
      # (classpath:/static/, image Docker) ou lu depuis le dossier de build local.
      static-locations: classpath:/static/,file:./frontend/dist/frontend/browser/

logging:
  level:
    com.bioconversion: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: false

app:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-256-bits-long-for-hs256-algorithm-!!}
    expiration-ms: 86400000
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  upload:
    identite-dir: ${UPLOAD_DIR:./uploads/identites}
  factures:
    dossier: ${FACTURES_DIR:./factures}
  commission:
    # C-MUST-5 : taux de commission plateforme, paramétrable côté administration.
    # Fraction du montant du paiement (0.05 = 5%), jamais codé en dur dans FactureService.
    taux: ${COMMISSION_TAUX:0.05}
  paiement:
    webhook-secret: ${WEBHOOK_SECRET:dev-secret-change-in-production}
    # Tant que l'agrégateur Orange Money n'est pas branché, la confirmation opérateur
    # est simulée depuis l'interface. Passer à false dès que le webhook réel est actif.
    simulation: ${PAIEMENT_SIMULATION:true}
  iot:
    api-key: ${IOT_API_KEY:dev-iot-api-key-change-in-production}
  demo:
    # Comptes et catalogue de démonstration créés au démarrage s'ils n'existent pas.
    enabled: ${DEMO_DATA:false}
  admin:
    # Compte administrateur créé au premier démarrage si les deux valeurs sont fournies.
    telephone: ${ADMIN_TELEPHONE:}
    mot-de-passe: ${ADMIN_MOT_DE_PASSE:}
  entreprise:
    nom: ${ENTREPRISE_NOM:BIO CONVERSION}
    ifu: ${ENTREPRISE_IFU:À renseigner}
    rccm: ${ENTREPRISE_RCCM:À renseigner}
    adresse: ${ENTREPRISE_ADRESSE:Ouagadougou, Burkina Faso}
    telephone: ${ENTREPRISE_TELEPHONE:À renseigner}
    email: ${ENTREPRISE_EMAIL:contact@bioconversion.bf}
    banque: ${ENTREPRISE_BANQUE:À renseigner}
    iban: ${ENTREPRISE_IBAN:À renseigner}
