# Profil "local" : aucune installation requise (ni PostgreSQL, ni Docker).
# Base H2 stockée dans ./data, schéma créé par Hibernate, comptes de démonstration actifs.
spring:
  datasource:
    url: jdbc:h2:file:./data/bioconversion;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

app:
  demo:
    enabled: ${DEMO_DATA:true}
